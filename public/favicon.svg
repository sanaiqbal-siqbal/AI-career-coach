<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Briefcase body -->
  <rect x="7" y="13" width="18" height="12" rx="2.5" fill="url(#spark)" opacity="0.95"/>

  <!-- Briefcase handle -->
  <path d="M12 13v-2a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
    stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Center clasp line -->
  <line x1="16" y1="13" x2="16" y2="25"
    stroke="#6366f1" stroke-width="1.4" opacity="0.5"/>

  <!-- Sparkle top-right -->
  <g transform="translate(21, 7)">
    <line x1="2" y1="0" x2="2" y2="4" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <line x1="0" y1="2" x2="4" y2="2" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
